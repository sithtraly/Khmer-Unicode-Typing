<!DOCTYPE html>
<html lang="km">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ឧបករណ៍ហាត់វាយខ្មែរ</title>
	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="./images/favicon.png" type="image/png">
</head>

<body>
	<audio id="audio" src="audios/incorrect.mp3" preload="auto" class="d-none"></audio>
	<div class="container">
		<!-- M: Menu -->
		<div class="menu">
			<h2>ឧបករណ៍ហាត់វាយអក្សរខ្មែរ</h2>
			<div>
				<label for="lesson-select">ជ្រើសរើសមេរៀន៖</label>
				<select name="lesson" id="lesson-select" onchange="loadLesson(this.value, this)"></select>
				<button onclick="showHelp()">ជំនួយ</button>
			</div>
		</div>

		<div class="main">
			<!-- Row 2: A B C -->
			<div class="row2">
				<div class="panel">
					<h3 class="m-0">A. អត្ថបទដែលត្រូវវាយ</h3>
					<div id="text-to-type"></div>
				</div>
				<div class="panel">
					<h3>B. មេរៀន</h3>
					<div id="lesson-content"></div>
				</div>
			</div>

			<!-- Row 3: D E -->
			<div class="row3">
				<!-- D: Keyboard -->
				<div class="panel">
					<h3>D. ក្តារចុច QWERTY</h3>
					<div id="keyboard" class="keyboard"></div>
				</div>
				<!-- E: Fingers -->
				<div class="panel">
					<h3>E. ទីតាំងម្រាមដៃ</h3>
					<div class="fingers">
						<div class="hand">
							<div class="hand-label">ឆ្វេង</div>
							<span id="l-pinky" class="finger">🖐️ កូន</span>
							<span id="l-ring" class="finger">💍 នាង</span>
							<span id="l-middle" class="finger">🖕 កណ្ដាល</span>
							<span id="l-index" class="finger">☝️ ចង្អុល</span>
						</div>
						<div class="hand">
							<div class="hand-label">ស្ដាំ</div>
							<span id="r-index" class="finger">☝️ ចង្អុល</span>
							<span id="r-middle" class="finger">🖕 កណ្ដាល</span>
							<span id="r-ring" class="finger">💍 នាង</span>
							<span id="r-pinky" class="finger">🖐️ កូន</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="index.js"></script>
</body>

</html>
